name: Scheduled Scrape

on:
  schedule:
    # Her 3 saatte bir (spec: 2-4 saat aralığı)
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: sudo apt-get update && sudo apt-get install -y xvfb

      # Scraper headed Chromium gerektirir (bkz. README) — Xvfb sanal ekran sağlar.
      - run: xvfb-run -a npm run scheduler:run-once
