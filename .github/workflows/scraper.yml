name: Scheduled Scrape

# NOT (2026-09-09): cron tetikleyicisi kasıtlı olarak KAPALI.
# GitHub Actions runner'larının IP'leri Trendyol/Cloudflare tarafından bot
# olarak işaretleniyor — Xvfb + headed Chromium doğru çalışıyor ama istek
# HTTP 418 ile reddediliyor (aynı kod, aynı gece, kullanıcının kendi
# makinesinden/residential IP'den 200 dönüyor). Yani sorun headed/headless
# değil, runner'ın datacenter IP'si. Kalıcı çözüm: scraper'ı residential/ev
# IP'sine sahip bir makineden (kullanıcının kendi bilgisayarı ya da normal
# bir ev bağlantısı olan bir sunucu) çalıştırmak. Kanıtlanmadan cron'u
# tekrar açmayın — aksi halde her 3 saatte bir sessizce başarısız olur.
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: sudo apt-get update && sudo apt-get install -y xvfb

      # Scraper headed Chromium gerektirir (bkz. README) — Xvfb sanal ekran sağlar.
      - run: xvfb-run -a npm run scheduler:run-once
