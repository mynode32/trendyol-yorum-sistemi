name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trendyol
          POSTGRES_PASSWORD: trendyol
          POSTGRES_DB: trendyol_reviews
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://trendyol:trendyol@localhost:5432/trendyol_reviews
      DIRECT_URL: postgresql://trendyol:trendyol@localhost:5432/trendyol_reviews
      SESSION_SECRET: ci-only-secret-32-characters-long!!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run test

      - run: npm run build
